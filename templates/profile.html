<!DOCTYPE html>

<html>

<head>
    <title>Your Profile</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            border: none;
        }

        img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid white;
        }
    </style>

</head>

<body>
    <h1>Your Profile</h1>
    <img id="cat_image" src="../static/IMG/fluffington.jpg">
    <div id="datadiv"></div>
    <div><h2 id="cat_name"></h2></div>
    <div><h3 id="cat_age"></h3></div>
    <div><h4 id="cat_bio"></h4></div>
    <button onclick="updateCat()">Swipe Left</button>
    <button onclick="swipeRight()">Swipe Right</button>
    <script src="../static/profile.js"></script>

</body>

</html>
